apiVersion: 1

datasources:
  - name: InfluxDB-Modified
    type: influxdb
    access: proxy
    url: http://influxdb-modified:8086
    database: testdb
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "10s"
      
  - name: InfluxDB-Stock
    type: influxdb
    access: proxy
    url: http://influxdb-stock:8086
    database: testdb
    isDefault: false
    editable: true
    jsonData:
      timeInterval: "10s"
