syntax = "proto3";

package tsdb;

option go_package = "github.com/influxdata/influxdb/tsdb/internal";

//========================================================================
//
// Metadata
//
//========================================================================

message Series {
  string Key = 1;
  repeated Tag Tags = 2;
}

message Tag {
  string Key = 1;
  string Value = 2;
}

message MeasurementFields {
  bytes Name = 1;
  repeated Field Fields = 2;
  repeated FieldMapping Mappings = 3;  // NEW
}

message Field {
  bytes Name = 1;
  int32 Type = 2;
}

message FieldMapping {
  string UserName = 1;        // User-facing name
  string InternalName = 2;    // Internal storage name (seriesKey#!~#internalName)
  int64 Version = 3;          // Monotonic version counter
  FieldMappingState State = 4;
}

enum FieldMappingState {
  ACTIVE = 0;
  DELETED = 1;
  RENAMED = 2;
}

message MeasurementFieldSet {
	repeated MeasurementFields Measurements = 1;
}

// FieldMappingSet stores centralized field mappings per database
message FieldMappingSet {
	repeated FieldMappingMeasurement Measurements = 1;
}

message FieldMappingMeasurement {
	bytes Name = 1;                            // Measurement name
	repeated FieldMapping Mappings = 2;        // Field mappings for this measurement
}

enum MeasurementMappingState {
  MEASUREMENT_ACTIVE = 0;
  MEASUREMENT_DELETED = 1;
  MEASUREMENT_RENAMED = 2;
}

message MeasurementMapping {
  string UserName = 1;
  string InternalName = 2;
  int64 Version = 3;
  MeasurementMappingState State = 4;
}

message MeasurementMappingSet {
  repeated MeasurementMapping Mappings = 1;
}

enum DatabaseMappingState {
  DATABASE_ACTIVE = 0;
  DATABASE_DELETED = 1;
  DATABASE_RENAMED = 2;
}

message DatabaseMapping {
  string UserName = 1;
  string InternalName = 2;
  int64 Version = 3;
  DatabaseMappingState State = 4;
}

message DatabaseMappingSet {
  repeated DatabaseMapping Mappings = 1;
}
